<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NEON DRIFT — Cyberpunk Walk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #05060f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #eaf2ff; }
  #c { display: block; width: 100vw; height: 100vh; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(120,230,255,0.9); box-shadow: 0 0 8px rgba(120,230,255,0.9);
    opacity: 0; transition: opacity .3s;
  }
  #hud.playing #crosshair { opacity: 1; }
  #fps {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 10px;
    font-size: 11px; letter-spacing: .5px; color: rgba(170,200,230,.6);
    font-variant-numeric: tabular-nums;
  }
  #build {
    position: absolute; right: 8px; bottom: calc(6px + env(safe-area-inset-bottom));
    font-size: 10px; opacity: .3;
  }

  /* start / pause overlay */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 35%, rgba(40,12,60,.55), rgba(5,6,15,.86));
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: opacity .4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .logo {
    font-size: 40px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg,#5ef0ff,#b06bff 50%,#ff5da2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 40px rgba(150,90,255,.4);
  }
  .sub { font-size: 14px; opacity: .7; max-width: 360px; line-height: 1.5; }
  .keys { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  .key { font-size: 12px; padding: 6px 12px; border-radius: 10px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); }
  .play-btn {
    pointer-events: auto; cursor: pointer; margin-top: 8px;
    padding: 15px 46px; border-radius: 30px; border: 1px solid rgba(255,255,255,.35);
    font-size: 18px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, rgba(110,90,255,.6), rgba(255,90,180,.5));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 12px 30px rgba(124,92,255,.45);
  }
  .play-btn:active { transform: scale(.96); }
  #loading { font-size: 13px; opacity: .6; }

  /* mobile controls */
  #touch { position: fixed; inset: 0; z-index: 15; display: none; }
  #hud.playing.touch ~ #touch, body.touch #touch { }
  #stick {
    position: absolute; left: 24px; bottom: calc(28px + env(safe-area-inset-bottom));
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15);
    pointer-events: auto;
  }
  #nub {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(150,200,255,.35); border: 1px solid rgba(200,230,255,.5);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="crosshair"></div>
  <div id="fps"></div>
  <div id="build"></div>
</div>
<div id="touch"><div id="stick"><div id="nub"></div></div></div>
<div id="overlay">
  <div class="logo">NEON DRIFT</div>
  <div class="sub">Eine kleine Cyberpunk-Welt zum Umherlaufen. Verlauf dich in den nassen Neon-Gassen.</div>
  <div class="keys">
    <span class="key">WASD / Pfeile — Laufen</span>
    <span class="key">Maus — Umsehen</span>
    <span class="key">Shift — Sprinten</span>
    <span class="key">Esc — Pause</span>
  </div>
  <div id="loading">Lade Welt …</div>
  <button class="play-btn" id="play" style="display:none">Betreten</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.js",
    "three/addons/": "./libs/jsm/"
  }
}
</script>
<script type="module" src="./js/game.js"></script>
</body>
</html>
